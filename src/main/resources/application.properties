spring.application.name=eventos

# H2 is the default for local development. Docker overrides these values with PostgreSQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:eventos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Kafka is configured through the environment so local and Docker execution can use different brokers.
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
kafka.topics.compras-confirmadas=compras.confirmadas
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer wraps the JSON deserializer so a malformed message goes to the DLT instead of blocking the partition.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.jnrptt.eventos.event.CompraConfirmadaEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.health.probes.enabled=true

jwt.secret=${JWT_SECRET:xvCGkUtty8zWPMWQn1rqb5anhDPop/mUDBnN6grrNs8=}
jwt.expiration=1h

# Initial ORGANIZADOR created on startup. Without email and password nothing is created.
organizador.email=${ORGANIZADOR_EMAIL:}
organizador.password=${ORGANIZADOR_PASSWORD:}
organizador.nombre=${ORGANIZADOR_NOMBRE:Organizador}
